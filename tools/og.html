<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;700;800&family=Plus+Jakarta+Sans:wght@500;800&display=block">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#fff;font-family:"Plus Jakarta Sans","Noto Sans TC","PingFang TC",sans-serif;color:#111519;
     display:grid;grid-template-columns:1fr 380px;align-items:center;padding:0 72px;position:relative}
.bar{position:absolute;left:0;top:0;width:100%;height:8px;
     background:linear-gradient(90deg,#1769DC 0 40%,#BF63F4 40% 70%,#FFA902 70% 100%)}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:17px;letter-spacing:.16em;text-transform:uppercase;
     color:#798695;display:flex;align-items:center;gap:14px;margin-bottom:26px}
.eyebrow::before{content:"";width:34px;height:1px;background:#C6CDD7}
h1{font-size:66px;line-height:1.1;font-weight:800;letter-spacing:-.03em}
h1 em{font-style:normal;color:#1769DC}
.sub{margin-top:24px;font-size:24px;line-height:1.6;color:#404B58;font-weight:400;max-width:100%;white-space:nowrap}
.foot{position:absolute;left:72px;bottom:52px;display:flex;align-items:center;gap:16px;
      font-size:20px;color:#798695}
.foot b{color:#111519;font-weight:700}
.foot i{width:5px;height:5px;border-radius:50%;background:#C6CDD7;font-style:normal}
.art{justify-self:end;display:grid;gap:11px;width:360px}
.rung{display:flex;align-items:center;gap:14px;border:1px solid #E4E8EE;border-left-width:5px;
      border-radius:8px;padding:13px 16px;background:#fff;
      box-shadow:0 14px 34px -26px rgba(17,21,25,.5)}
.rung b{font-size:19px;font-weight:700;flex:1}
.rung code{font-family:"IBM Plex Mono",monospace;font-size:13px;color:#798695;letter-spacing:.06em}
</style></head><body>
<div class="bar"></div>
<div>
  <p class="eyebrow">Atlassian Cloud · 資安附加訂閱</p>
  <h1>Atlassian Guard<br><em>Standard 與 Premium</em><br>選版指南</h1>
  <p class="sub">功能對照 · 場景對照 · 定價級距 · 導入 FAQ</p>
</div>
<div class="art">
  <div class="rung" style="border-left-color:#71808F"><b>Public</b><code>LEVEL 1</code></div>
  <div class="rung" style="border-left-color:#2E6FA8"><b>Internal</b><code>LEVEL 2</code></div>
  <div class="rung" style="border-left-color:#A85C22"><b>Confidential</b><code>LEVEL 3</code></div>
  <div class="rung" style="border-left-color:#8E2B2B"><b>Restricted</b><code>LEVEL 4</code></div>
</div>
<div class="foot"><b>atlassianguard.com</b><i></i><span>新加坡商鈦坦科技</span></div>
</body></html>
