name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只授予寫入 Pages 所需的最小權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；新的 push 不取消進行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 把 index.html 內的 ?v= 改寫為 style.css／app.js 的內容雜湊，讓長效快取
      # 隨檔案內容自動失效。只改工作目錄、不回寫倉庫；倉庫內維持日期版本，
      # 因此本機直接開啟 index.html 仍可正常運作。
      # 找不到對應的 ?v= 或資源檔時會讓部署失敗，避免無聲地失去快取失效機制。
      - name: Stamp asset versions
        run: python3 tools/stamp-assets.py

      # 依 BudouX 繁中詞界在內文插入 <wbr>，搭配樣式表的 word-break:keep-all，
      # 中文只在詞的邊界換行。同樣只改工作目錄，倉庫內的 index.html 不含 <wbr>。
      - name: Insert word-boundary hints
        run: |
          python3 -m pip install --quiet budoux==0.9.1
          python3 tools/wbr.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 純靜態網站，整個 repo 根目錄即為網站內容
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
